services:
  kb_vectordb:
    image: ankane/pgvector:latest
    container_name: kb_vectordb
    restart: unless-stopped
    environment:
      POSTGRES_USER: kbuser
      POSTGRES_PASSWORD: kbpass
      POSTGRES_DB: knowledge_db
    ports:
      - "5435:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro

  # optional GUI: http://localhost:5051  (login: admin@kb.local / kbadmin)
  kb_pgadmin:
    image: dpage/pgadmin4:latest
    container_name: kb_pgadmin
    restart: unless-stopped
    profiles: ["gui"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@kb.local
      PGADMIN_DEFAULT_PASSWORD: kbadmin
    ports:
      - "5051:80"
    volumes:
      - ./pgadmin_data:/var/lib/pgadmin
    depends_on:
      - kb_vectordb
