# Langfuse keys for KB Helper tracing.
# 1. Sign up at https://cloud.langfuse.com (EU) or https://us.cloud.langfuse.com (US)
# 2. Create an organization and a project -> Settings -> API Keys -> Create new API keys
# 3. Copy this file to langfuse.yml and paste the keys (langfuse.yml is gitignored)
# 4. Check: python langfuse_tracing.py   then restart the server: ./kbhelper restart
langfuse:
  public_key: "pk-lf-xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
  secret_key: "sk-lf-xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
  host: "https://cloud.langfuse.com"    # US region: https://us.cloud.langfuse.com
  environment: "development"
  enabled: true
