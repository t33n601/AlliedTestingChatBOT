[pytest]
testpaths = tests/qa_auto
pythonpath = .
addopts = -ra -m "not e2e"
markers =
    positive: positive scenario (valid input, expected behaviour)
    negative: negative scenario (invalid input, attacks, off-topic, errors)
    llm: calls the language model (slower, needs Ollama)
    e2e: browser test through Selenoid (run explicitly with -m e2e)
