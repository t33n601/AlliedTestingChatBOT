<!doctype html>
<html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><style>
body{margin:0;background:#19191B}
a{color:#ECECEA}a:hover{color:#FFFFFF}
.blink{animation:blink 1s steps(2) infinite}

.busy{animation:busy .9s steps(2) infinite}

.skel{animation:skel 1.6s ease-in-out infinite}

.pulse{animation:pulse 2s infinite}

.fade{animation:fade .3s ease-out}

.sheet{animation:up .28s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
/* liquid-glass tab bar */
.glass{background-color:rgba(36,36,40,.42);background-image:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.04) 46%,rgba(0,0,0,.10));-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -1px 1px rgba(0,0,0,.35),inset 0 0 20px rgba(255,255,255,.05),0 14px 34px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.35)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:27px;text-decoration:none;color:rgba(236,236,234,.78);font-family:'Silkscreen',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;transition:background .25s,color .25s,transform .2s}
.tab:hover{color:#FFFFFF;background:rgba(255,255,255,.07)}
.tab:active{transform:scale(.93)}
.tab.on{color:#FFFFFF;background:linear-gradient(180deg,rgba(239,97,80,.82),rgba(193,64,49,.66));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 5px rgba(0,0,0,.25),0 4px 16px rgba(193,64,49,.5)}

@media (prefers-reduced-motion: reduce){.blink,.busy,.skel,.pulse,.fade,.sheet{animation:none}}
